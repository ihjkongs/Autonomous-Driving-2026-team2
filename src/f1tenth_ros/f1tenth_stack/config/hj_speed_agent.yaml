hj_speed_agent_node:
  ros__parameters:
    policy_file: ''            # required: absolute path to 4321-input driving_policy.ts
    scan_topic: /scan
    odom_topic: /odom          # vesc_to_odom_node: twist.twist.linear.x [m/s]
    drive_topic: /drive
    prediction_topic: /agent/prediction
    command_preview_topic: /agent/command_preview
    dry_run: true              # never publish /drive unless explicitly false
    device: cpu
    laser_yaw_offset: 0.0
    speed_limit: 1.0           # raise gradually only after dry_run checks
    max_acceleration: 2.0
    max_deceleration: 3.0
    scan_timeout: 0.2
    odom_max_skew: 0.1         # |scan stamp - odom stamp| above this -> stop
    odom_timeout: 0.25         # no fresh odom within this (receipt time) -> stop
    odom_reverse_tolerance: 0.1  # linear.x < -this -> stop; within tolerance -> abs()
    odom_max_speed_input: 8.0  # |linear.x| above this -> stop
    use_header_stamps: true
    # speed_source: odom (default) | vesc_core (/sensors/core ERPM; gain must match the running vesc nodes; offset is the measured-ERPM intercept)
    speed_source: odom
    core_topic: /sensors/core
    speed_to_erpm_gain: 2500.0
    core_speed_offset_erpm: 0.0
    core_deadband: 0.05
    # LiDAR following guard (reduce-only speed cap). Default OFF; see README.
    guard_enabled: false
    guard_variant: a9          # a9 | v2f | custom (custom needs all four fields below)
    guard_file: ''             # '' = packaged file of the variant
    guard_sha256: ''           # '' = SHA of the variant (a9 731d2786..., v2f 234aa1b8...)
    guard_params_file: ''      # '' = share/f1tenth_stack/config/<variant params> (JSON content)
    guard_params_sha256: ''    # '' = SHA of the variant params (a9 3767b3b7..., v2f a44923a9...)
