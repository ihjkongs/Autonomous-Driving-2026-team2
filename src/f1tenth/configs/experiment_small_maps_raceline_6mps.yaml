description: Offline vehicle-clearance and steering-constrained racing-line 
  expert. Local path/time optimization; verify simulator rollouts before label 
  collection.
assumptions:
  ground_speed_calibrated: false
  electrical_faults_simulated: false
  note: ERPM response cannot identify tire slip, ground speed or battery charge 
    limits.
task:
  max_speed: 6.0
  lidar_frames: 4
  obs_dim: 4320
dynamics:
  longitudinal_response:
    acceleration: 2.0
    deceleration: 3.0
    time_constant: 0.25
    delay: 0.10
    command_acceleration: 2.0
    command_deceleration: 3.0
    ranges:
      acceleration:
      - 1.5
      - 2.5
      deceleration:
      - 2.0
      - 3.5
      time_constant:
      - 0.15
      - 0.4
      delay:
      - 0.05
      - 0.2
expert:
  speed_cap: 6.0
  vgain: 1.0
  tlad: 0.7
  lookahead_time: 0.05
  max_lookahead: 1.0
  lateral_acceleration: 4.0
  anticipatory_braking: true
  braking_deceleration: 2.0
  planning_acceleration: 2.0
  reaction_time: 0.15
  curvature_window: 0.75
  reference: raceline
  raceline_directory: results/racelines/20261125_constrained_all
